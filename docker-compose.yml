services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ssu_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_app

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ssu_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres_db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - red_app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssu_backend
    restart: always
    ports:
      - "${BACKEND_PORT_HOST}:${PORT}"
    environment:
      - PORT=${PORT}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres_db
    networks:
      - red_app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssu_frontend
    restart: always
    ports:
      - "${VITE_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - red_app

volumes:
  postgres_data:
  pgadmin_data:

networks:
  red_app:
    driver: bridge