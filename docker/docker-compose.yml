services:
  postgres:
    image: postgres:18
    container_name: seguro_social_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d

volumes:
  pgdata: